<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradiate - Supported Districts</title>
  <meta name="description" content="Every school district Gradiate supports." />
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <!-- Component Styles -->
  <link rel="stylesheet" href="styles/navigation.css" />
  <link rel="stylesheet" href="styles/districts.css" />
  <link rel="stylesheet" href="styles/footer.css" />
  <!-- External Libraries -->
  <script src="scripts/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="scripts/districts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="shortcut icon" href="images/logo-rounded.png" type="image/x-icon" />
</head>

<body>
  <div class="container">
    <nav class="navbar">
      <div class="navbar__container">
        <a href="index.html" class="logo">
          <img src="images/logo-rounded.png" alt="Gradiate Logo" class="logo__image" />
          <h1 class="logo__text">Gradiate</h1>
        </a>
        <div class="nav-links">
          <a href="index.html#features" class="nav-links__link">Features</a>
          <a href="index.html#how-it-works" class="nav-links__link">How It Works</a>
          <a href="index.html#comparison" class="nav-links__link">Comparison</a>
          <a href="districts.html" class="nav-links__link">Districts</a>
          <div class="nav-buttons">
            <button id="theme-toggle" class="nav-button">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
              <svg xmlns="http://www.w3.org/2000/svg" class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            </button>
            <a href="https://github.com/ruskcoder/" class="nav-button" title="github" target="_blank">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github-icon lucide-github"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            </a>
            <a href="https://www.instagram.com/gradexis.app/" class="nav-button" title="instagram" target="_blank">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-instagram-icon lucide-instagram"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <main class="districts">
      <header class="districts__header">
        <h1 class="districts__heading">Supported Districts</h1>
        <p class="districts__subheading">
          Gradiate works with <strong><span id="district-count">hundreds of</span> school districts</strong>.
          Don't see yours? Let us know on
          <a href="https://www.instagram.com/gradiate.app/" target="_blank">Instagram</a>.
        </p>
      </header>

      <!-- Choropleth placeholder: per-state data isn't available yet, so every state is drawn gray. -->
      <section class="districts-map" aria-label="Map of districts by state">
        <svg class="districts-map__svg" id="districts-map" viewBox="0 0 975 610" role="img"
          aria-label="Map of the United States. District counts by state are coming soon."></svg>
        <div class="districts-map__overlay">
          <span class="districts-map__badge"><i data-lucide="map"></i> Coming soon</span>
        </div>
      </section>

      <section class="districts-list" aria-label="All supported districts">
        <div class="districts-list__toolbar">
          <label class="districts-search">
            <i data-lucide="search"></i>
            <input type="search" id="district-search" class="districts-search__input"
              placeholder="Search districts" autocomplete="off" aria-label="Search districts" />
          </label>
          <span class="districts-list__results" id="district-results" aria-live="polite"></span>
        </div>

        <ul class="districts-list__grid" id="district-list">
          <li class="districts-list__status">Loading districts…</li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__content">
        <h1 class="footer__brand">Gradiate</h1>
        <p class="footer__tagline">Academic success, at your fingertips.</p>
      </div>
      <div class="footer__links">
        <a href="https://github.com/ruskcoder/gradiate" class="footer__link">GitHub</a>
        <a href="https://www.instagram.com/gradiate.app/" class="footer__link">Instagram</a>
        <a href="/districts.html" class="footer__link">Districts</a>
        <a href="/privacy-policy.html" class="footer__link">Privacy Policy</a>
      </div>
    </footer>
  </div>
</body>

</html>
